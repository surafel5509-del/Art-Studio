name: Android CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -Dkotlin.daemon.jvm.options=-Xmx2g"

jobs:
  # ---------------------------------------------------------------------------
  # Fast feedback: compile + JVM/Robolectric unit tests.
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
          cache-read-only: false

      - name: Unit tests
        id: tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest --stacktrace --continue --console=plain 2>&1 | tee build.log

      # Compile/test diagnostics are surfaced as check-run annotations so failures
      # are readable from the API without downloading the (large) raw log archive.
      - name: Report diagnostics
        if: failure()
        run: |
          emit() {
            clean=${1//'%'/'%25'}
            clean=${clean//$'\r'/''}
            clean=${clean//$'\n'/'%0A'}
            echo "::error::${clean:0:900}"
          }
          # 1. Compiler errors.
          grep -E "^e: " build.log | head -40 | while IFS= read -r line; do emit "$line"; done

          # 2. Unit-test failures, with the assertion message, so the reason is
          #    visible from the check-run annotations (no log download needed).
          python3 - <<'PYEOF'
          import glob, xml.etree.ElementTree as ET, os
          for f in glob.glob('app/build/test-results/**/*.xml', recursive=True):
              try:
                  root = ET.parse(f).getroot()
              except Exception:
                  continue
              for case in root.iter('testcase'):
                  for fail in list(case.iter('failure')) + list(case.iter('error')):
                      msg = (fail.get('message') or '').strip()
                      body = (fail.text or '').strip().splitlines()
                      # Include the first stack frames: assertion messages are often
                      # empty (e.g. NullPointerException) and the frame names are what
                      # actually locate the defect.
                      detail = ' | '.join(body[:6])[:700]
                      print(
                          f"::error::{case.get('classname')}.{case.get('name')}: "
                          f"{msg[:200]} {detail}"
                      )
          PYEOF
          tail -20 build.log || true
          exit 1

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Debug APK + release AAB. Debug APK is installable; release AAB is signed with
  # the debug key unless ARTFORGE_* secrets are present.
  # ---------------------------------------------------------------------------
  build:
    name: Build artifacts
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Promoted from secrets so the step-level `if` can test emptiness:
      # the `secrets` context is not available in step `if` expressions.
      KEYSTORE_BASE64: ${{ secrets.ARTFORGE_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ARTFORGE_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ARTFORGE_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ARTFORGE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Restore release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/artforge-release.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/artforge-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Bundle release AAB
        run: ./gradlew --no-daemon :app:bundleRelease --stacktrace

      - name: Rename artifacts
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/artforge-mobile-${GITHUB_SHA::7}-debug.apk"
          find app/build/outputs/bundle/release -name '*.aab' -exec cp {} "out/artforge-mobile-${GITHUB_SHA::7}-release.aab" \;

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: artforge-mobile-artifacts
          path: out/*
          retention-days: 30
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Instrumented UI tests need an emulator, so they run separately and are
  # allowed to fail without blocking artifact delivery (they are flaky on shared
  # runners) — but a failure is still visible in the run summary.
  # ---------------------------------------------------------------------------
  instrumented-tests:
    name: Instrumented UI tests
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Hardware virtualisation is not guaranteed on hosted runners. Without it the
      # emulator dies during launch and no test output is produced at all, so detect
      # it up front rather than reporting a bogus test failure.
      - name: Check hardware acceleration
        id: kvm
        run: |
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "KVM is available"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::/dev/kvm is not usable on this runner — instrumented tests skipped"
          fi

      # The emulator is managed directly (rather than through an action) so its own
      # output lands in instrumented.log and can be annotated when it fails to boot.
      - name: Boot emulator
        id: emulator
        if: steps.kvm.outputs.available == 'true'
        run: |
          set -o pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "sdk=$SDK" >> "$GITHUB_OUTPUT"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "emulator" "system-images;android-34;google_apis;x86_64" \
            >> instrumented.log 2>&1
          echo "no" | "$SDK/cmdline-tools/latest/bin/avdmanager" \
            create avd -n ci34 -k "system-images;android-34;google_apis;x86_64" -d pixel_6 \
            >> instrumented.log 2>&1
          nohup "$SDK/emulator/emulator" -avd ci34 -no-window -no-audio -no-boot-anim \
            -no-snapshot -gpu swiftshader_indirect -netdelay none -netspeed full \
            >> instrumented.log 2>&1 &
          "$SDK/platform-tools/adb" wait-for-device
          for i in $(seq 1 180); do
            booted=$("$SDK/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$booted" = "1" ]; then echo "emulator booted"; exit 0; fi
            sleep 2
          done
          echo "::error::emulator did not finish booting within 6 minutes"
          tail -60 instrumented.log
          exit 1

      - name: Run instrumented tests
        id: instrumented
        if: steps.emulator.outcome == 'success'
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:connectedDebugAndroidTest \
            --stacktrace --console=plain 2>&1 | tee -a instrumented.log

      - name: Report instrumentation diagnostics
        if: failure()
        run: |
          emit() {
            clean=${1//'%'/'%25'}
            clean=${clean//$'\r'/''}
            clean=${clean//$'\n'/'%0A'}
            echo "::error::${clean:0:900}"
          }
          if [ -f instrumented.log ]; then
            grep -E "^e: |FAILED|Error|Exception|Installation|INSTALL_" instrumented.log \
              | head -20 | while IFS= read -r line; do emit "$line"; done
          else
            emit "instrumented.log missing: the emulator/Gradle step failed before tests ran"
          fi
          python3 - <<'PYEOF'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('app/build/outputs/androidTest-results/**/*.xml', recursive=True):
              try:
                  root = ET.parse(f).getroot()
              except Exception:
                  continue
              for case in root.iter('testcase'):
                  for fail in list(case.iter('failure')) + list(case.iter('error')):
                      msgs = (fail.text or '').strip().splitlines()
                      detail = ' | '.join(msgs[:8])[:800]
                      print(f"::error::{case.get('classname')}.{case.get('name')}: {detail}")
          PYEOF
          exit 1

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Instrumented tests"
            echo ""
            if [ "${{ steps.kvm.outputs.available }}" != "true" ]; then
              echo "Skipped: this runner exposes no usable \`/dev/kvm\`, so the Android"
              echo "emulator cannot boot. The same suite runs locally with"
              echo "\`./gradlew :app:connectedDebugAndroidTest\`."
            elif [ "${{ steps.emulator.outcome }}" != "success" ]; then
              echo "Emulator failed to boot. See the annotated errors above and the"
              echo "\`instrumented-test-reports\` artifact."
            else
              echo "Result: ${{ steps.instrumented.outcome }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            instrumented.log
            ~/.android/avd/*.log
          if-no-files-found: ignore
          retention-days: 14
