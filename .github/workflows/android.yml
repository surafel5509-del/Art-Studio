name: Android CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -Dkotlin.daemon.jvm.options=-Xmx2g"

jobs:
  # ---------------------------------------------------------------------------
  # Fast feedback: compile + JVM/Robolectric unit tests.
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
          cache-read-only: false

      - name: Ensure SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Debug APK + release AAB. Debug APK is installable; release AAB is signed with
  # the debug key unless ARTFORGE_* secrets are present.
  # ---------------------------------------------------------------------------
  build:
    name: Build artifacts
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Restore release keystore
        if: ${{ secrets.ARTFORGE_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ARTFORGE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/artforge-release.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/artforge-release.jks
          storePassword=${{ secrets.ARTFORGE_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ARTFORGE_KEY_ALIAS }}
          keyPassword=${{ secrets.ARTFORGE_KEY_PASSWORD }}
          EOF

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Bundle release AAB
        run: ./gradlew --no-daemon :app:bundleRelease --stacktrace

      - name: Rename artifacts
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/artforge-mobile-${GITHUB_SHA::7}-debug.apk"
          find app/build/outputs/bundle/release -name '*.aab' -exec cp {} "out/artforge-mobile-${GITHUB_SHA::7}-release.aab" \;

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: artforge-mobile-artifacts
          path: out/*
          retention-days: 30
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Instrumented UI tests need an emulator, so they run separately and are
  # allowed to fail without blocking artifact delivery (they are flaky on shared
  # runners) — but a failure is still visible in the run summary.
  # ---------------------------------------------------------------------------
  instrumented-tests:
    name: Instrumented UI tests
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86
          profile: pixel_3a
          disable-animations: true
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest --stacktrace

      - name: Upload instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: app/build/reports/androidTests
          if-no-files-found: ignore
          retention-days: 14
